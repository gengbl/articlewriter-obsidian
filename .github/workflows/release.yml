name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch: {}

permissions:
  contents: write # 创建/更新 GitHub Release、上传资产
  id-token: write # artifact attestation（Sigstore 签名）所需
  attestations: write # 持久化 attestation 记录到仓库（REST create-an-attestation）所需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag→commit 解析需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check release/main.js

      - name: Read manifest version
        id: pkg
        run: |
          set -euo pipefail
          V=$(node -p "require('./manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # 保持「先发 Release、再 attest」顺序。「Failed to persist attestation」的真正根因是 workflow permissions 缺 `attestations: write`（persist/create-storage-record 走 REST create-an-attestation 落库所需），v0.0.9 补齐后经推 tag 验证通过；Rekor/Fulcio 透明日志条目独立生成，不受该权限影响
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.pkg.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET="${GITHUB_REF_NAME#v}"
            if [ "$TARGET" != "$V" ]; then
              echo "::error::推送的 tag $TARGET 与 manifest version $V 不一致，终止发布"
              exit 1
            fi
          else
            TARGET="$V"
          fi
          NOTES=$(printf '**v%s**\n\nBuilt automatically from source commit %s.' "$TARGET" "$GITHUB_SHA")
          # 约定：GitHub Release 资产只传三个散文件，不上传 zip（zip 附件只在 Gitea Release 维护）
          ASSETS=(release/main.js release/manifest.json release/styles.css)
          if gh release view "$TARGET" >/dev/null 2>&1; then
            echo "Release $TARGET 已存在 → 用 --clobber 覆盖同名资产（旧版本残留的其他文件不会被删除）"
            gh release upload "$TARGET" "${ASSETS[@]}" --clobber
          else
            gh release create "$TARGET" "${ASSETS[@]}" --title "v$TARGET" --notes "$NOTES"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/main.js
            release/styles.css
            release/manifest.json
